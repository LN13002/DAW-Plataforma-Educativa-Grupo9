[tools]
java = "temurin-21"

[env]
DB_HOST = "localhost"
DB_PORT = "5433"
DB_NAME = "aprende_ues"
DB_USER = "aprende_ues"
DB_PASSWORD = "aprende_ues"

[tasks.dev]
description = "Start Postgres and the backend in development mode"
depends = ["db:up"]
run = "mise run backend"

[tasks."db:up"]
description = "Start Postgres with Docker Compose"
run = "docker compose up -d --wait db"

[tasks."db:down"]
description = "Stop and remove the Postgres container"
run = "docker compose down"

[tasks."db:logs"]
description = "Show Postgres logs"
run = "docker compose logs -f db"

# tasks "backend" and "db:migrate" are defined as file tasks in .mise/tasks/
