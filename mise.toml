[tools]
java = "temurin-21"

[env]
DB_HOST = "localhost"
DB_PORT = "5433"
DB_NAME = "aprende_ues"
DB_USER = "aprende_ues"
DB_PASSWORD = "aprende_ues"

[tasks.dev]
description = "Start Postgres and the backend in development mode"
depends = ["db:up"]
run = "mise run backend"

[tasks."db:up"]
description = "Start Postgres with Docker Compose"
run = "docker compose up -d --wait db"

[tasks."db:down"]
description = "Stop and remove the Postgres container"
run = "docker compose down"

[tasks."db:logs"]
description = "Show Postgres logs"
run = "docker compose logs -f db"

[tasks."db:migrate"]
description = "Run pending Flyway migrations without starting the app"
dir = "backend"
run = "./mvnw flyway:migrate -Dflyway.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME} -Dflyway.user=${DB_USER} -Dflyway.password=${DB_PASSWORD}"

[tasks.backend]
description = "Start the Spring Boot backend and open Swagger UI"
dir = "backend"
run = """
./mvnw spring-boot:run &
APP_PID=$!
echo "Waiting for backend to be ready..."
until curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; do sleep 2; done
xdg-open "http://localhost:8080/swagger-ui.html"
wait $APP_PID
"""
