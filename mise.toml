[tools]
java = "temurin-21"
node = "lts"

[env]
DB_HOST = "localhost"
DB_PORT = "5433"
DB_NAME = "aprende_ues"
DB_USER = "aprende_ues"
DB_PASSWORD = "aprende_ues"

[tasks."db:up"]
description = "Start Postgres with Docker Compose"
run = "docker compose up -d --wait db"

[tasks."db:down"]
description = "Stop and remove the Postgres container"
run = "docker compose down"

[tasks."db:logs"]
description = "Show Postgres logs"
run = "docker compose logs -f db"

[tasks."app:up"]
description = "Build and start the full app stack with Docker Compose"
run = "docker compose up --build"

[tasks."app:down"]
description = "Stop the full app stack"
run = "docker compose down"

[tasks."app:logs"]
description = "Show full app stack logs"
run = "docker compose logs -f app db"

[tasks."backend:test"]
description = "Run backend unit tests"
run = "cd backend && ./mvnw test"

# tasks "dev", "backend", "frontend" and "db:migrate" are defined as file tasks in .mise/tasks/
